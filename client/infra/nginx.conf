server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → gateway service ──────────────────────────────────────────
    # IMPORTANT: do NOT use "location /session/" — that prefix block matches
    # SPA navigation routes like /session/:id/capture and /session/:id/review
    # and proxies them to the gateway instead of serving index.html.
    # Use exact match + regex restricted to known API terminal action names.

    # Exact match — only API route at this path depth
    location = /session/start {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # /session/:id/{action} and /session/:id/segment/... — known API actions only
    # SPA routes (/capture, /review) do not contain these terminal names so they
    # fall through to the try_files SPA fallback below.
    location ~ ^/session/[^/]+/(note|approve|stream|audio|end|amendment|segment) {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_buffering    off;    # required for SSE (text/event-stream)
        proxy_cache        off;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # keep SSE/WS connections alive
    }

    location /enrollment/ {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # stream multipart body without buffering
        proxy_set_header   Host $host;
    }

    location /pipeline/ {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /health {
        proxy_pass         http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Send all unmatched paths to index.html so React Router handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
