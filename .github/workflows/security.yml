name: Security

# Runs on every pull request into main, before merge. This is the gate: code
# reaches main through a reviewed PR with these checks green, never by a direct
# push. Also runs weekly so a newly disclosed CVE in a dependency surfaces
# without waiting for the next change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so --baseline-commit can diff against the merge base.
          fetch-depth: 0

      # Blocking: anything this branch introduces must be clean.
      - name: New findings (blocking)
        if: github.event_name == 'pull_request'
        # BASE_REF travels through the environment rather than being
        # interpolated into the script body. A ${{ }} expression spliced
        # directly into `run` is evaluated as shell text, so a crafted branch
        # name becomes command injection with this job's token.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASELINE="$(git merge-base "origin/$BASE_REF" HEAD)"
          semgrep scan --config=p/default --config=p/secrets \
            --baseline-commit "$BASELINE" --error --skip-unknown-extensions .

      # Informational: the whole tree, including pre-existing findings in
      # client/ and gateway/ that predate this workflow. Visible, not blocking,
      # so the gate stays meaningful instead of being permanently red.
      - name: Full tree (informational)
        continue-on-error: true
        run: semgrep scan --config=p/default --config=p/secrets --skip-unknown-extensions .

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install bandit[toml]
      # -ll reports medium severity and above, which skips B101 (assert) so the
      # test suite can be scanned rather than excluded from the gate.
      - run: bandit -r pipeline mirth -ll

  licence-guard:
    name: No CPT descriptors committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # CPT is copyrighted by the AMA and its descriptors may not be
      # redistributed. config/cpt_codes.json is gitignored; this fails the build
      # if it is ever committed anyway.
      - name: Fail if config/cpt_codes.json is tracked
        run: |
          if git ls-files --error-unmatch config/cpt_codes.json > /dev/null 2>&1; then
            echo "::error::config/cpt_codes.json is tracked. CPT descriptors are AMA-licensed and must not be committed."
            exit 1
          fi
          echo "OK: no CPT code table in version control."
